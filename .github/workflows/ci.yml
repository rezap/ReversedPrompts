name: checks

# Manual only. Click "Run workflow" in the Actions tab.
# `checks` needs no secrets and costs nothing; `api-smoke` spends money and is
# off unless you tick it.
on:
  workflow_dispatch:
    inputs:
      run_api_smoke:
        description: "Also call the OpenAI API (costs money, needs OPENAI_API_KEY)"
        type: boolean
        default: false
      pair:
        description: "Which prompt group to recover"
        type: choice
        default: ody-speaker-name
        options:
          - ody-speaker-name
          - ody-stake-material
          - ody-named-gods
          - ody-bow-outcome
          - ody-escape-method
          - ody-three-sentence-summary
      model:
        description: "Model id; leave blank to use the project default"
        type: string
        default: ""

jobs:
  checks:
    name: data integrity (free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

      - name: Confirm the pair file is not stale
        run: python tools/build_odyssey.py --check

      - name: Exercise the recovery loop offline
        run: |
          revprompt groups
          revprompt run --controls-only --simulate | tail -12

  api-smoke:
    name: OpenAI smoke test (spends money)
    needs: checks
    if: inputs.run_api_smoke
    runs-on: ubuntu-latest
    environment: openai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Show which model each role will use
        run: revprompt models

      # An empty `model` input means "whatever the code defaults to". Passing
      # --model only when one was typed keeps the workflow from pinning a
      # second copy of the default that then drifts out of sync with the code.
      - name: Recover one group's prompt against the live API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -n "$MODEL" ]; then
            revprompt run --group '${{ inputs.pair }}' --model "$MODEL" \
                     --show-outputs | tee smoke-output.txt
          else
            revprompt run --group '${{ inputs.pair }}' \
                     --show-outputs | tee smoke-output.txt
          fi

      - name: Keep the output as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.pair }}-${{ inputs.model || 'default' }}
          path: smoke-output.txt
