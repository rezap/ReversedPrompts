[project]
name = "reversed-prompts"
version = "0.0.0"
description = "Recover the prompt that maps a set of inputs to their outputs"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Retrieval. Optional because the loop does not use it yet, and because the
# whole test suite runs against the in-process backend without it.
rag = ["lancedb>=0.20"]
# Reading text-layer PDFs. Optional because nothing in the shipped corpus is a
# PDF, and pure-Python so it needs no system packages.
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "lancedb>=0.20", "pypdf>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
revprompt = "reversed_prompts.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test performs a real API call and costs money (deselected by default)",
]
